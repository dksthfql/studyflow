<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow</title>

    <!-- CSS 연결 -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>StudyFlow</h1>

        <p id="todayDate"></p>

        <button id="darkModeBtn">
            🌙 다크모드
        </button>
    </header>

    <nav>
        <a href="#home">홈</a>
        <a href="#goal">목표</a>
        <a href="#routine">루틴</a>
        <a href="#gallery">갤러리</a>
        <a href="#stats">통계</a>
    </nav>

    <section id="home">

        <h2>공부 루틴 관리 웹</h2>

        <p>매일의 공부를 관리하세요.</p>

    </section>

    <section id="goal">

        <h2>오늘의 목표</h2>

        <input
            type="text"
            id="taskInput"
            placeholder="공부 목표 입력">

        <input
            type="number"
            id="hourInput"
            placeholder="공부 시간">

        <button id="addBtn">
            추가하기
        </button>

    </section>

    <section id="routine">

        <h2>공부 루틴</h2>

        <ul id="taskList"></ul>

    </section>

    <section id="gallery">

        <h2>학습 갤러리</h2>

        <div class="gallery">

            <img src="study1.jpg" alt="공부 이미지1">
            
            <img src="study2.jpg" alt="공부 이미지2">
            
            <img src="study3.jpg" alt="공부 이미지3">

        </div>

        <p>
            이미지 출처 :
            Unsplash
        </p>

    </section>

    <section id="stats">

        <h2>학습 통계</h2>

        <p>
            전체 목표 :
            <span id="totalCount">0</span>
        </p>

        <p>
            완료 :
            <span id="completedCount">0</span>
        </p>

        <p>
            진행률 :
            <span id="progressPercent">0</span>%
        </p>

        <p>
            총 공부시간 :
            <span id="totalHours">0</span>시간
        </p>

        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>

        <div id="successMessage">
            🎉 오늘 목표를 모두 달성했습니다!
        </div>

    </section>
    <section id="survey">

    <h2>사용자 만족도 조사</h2>

    <iframe
    src="https://docs.google.com/forms/d/e/1FAIpQLSfr1eNVgWPZBo5bAf6iuyyhuukTdVbChll2WClZxcHhsn5lOA/viewform?usp=dialog"
    width="100%"
    height="700"
    frameborder="0">
    </iframe>

</section>

    <!-- JS 연결 -->
    <script src="js/script.js"></script>

</body>
</html>
